<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff0f3">
<title>Para Gabriela 💋</title>
<style>
:root{
  --bg:#fff0f3; --ink:#5c1230; --accent:#d6336c; --btn-text:#fff;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#2a0d1a; --ink:#ffd9e4; --accent:#ff6b9a; --btn-text:#2a0d1a; }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%}
body{
  min-height:100dvh;
  background:var(--bg); color:var(--ink);
  font-family:"Segoe Script","Brush Script MT","Snell Roundhand",cursive;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; overflow:hidden;
  padding:calc(1.5rem + env(safe-area-inset-top)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
}
h1{font-weight:400; font-size:clamp(2.4rem,12vw,4.5rem); line-height:1.2; margin:0 0 .75rem}
h1 span{color:var(--accent)}
p{font-family:system-ui,-apple-system,sans-serif; font-size:1.1rem; margin:0 0 1.75rem}
button{
  font-family:system-ui,-apple-system,sans-serif; font-size:1.25rem;
  background:var(--accent); color:var(--btn-text);
  border:0; border-radius:999px; padding:1rem 2rem; min-height:3.25rem;
  cursor:pointer; touch-action:manipulation;
}
button:active{transform:scale(.96)}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.kiss{position:fixed; bottom:-3rem; pointer-events:none; animation:up 3s ease-out forwards}
@keyframes up{to{transform:translateY(-115dvh) rotate(25deg); opacity:0}}
@media (prefers-reduced-motion: reduce){ .kiss{animation-duration:.01s} }
</style>
</head>
<body>
  <h1>Gabriela,<br>te amo <span>mucho</span> ❤️</h1>
  <p>Toca el botón…</p>
  <button id="b" type="button">Mandar un beso 😘</button>

<script>
const emojis = ["😘", "💋", "❤️", "💖", "💕"];
const sonido = new Audio("beso.mp3");

document.getElementById("b").addEventListener("click", () => {
  sonido.currentTime = 0;
  sonido.play();
  if (navigator.vibrate) navigator.vibrate(60);
  for (let i = 0; i < 25; i++) {
    const s = document.createElement("span");
    s.className = "kiss";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 90 + "vw";
    s.style.fontSize = (1.5 + Math.random() * 2.5) + "rem";
    s.style.animationDelay = (Math.random() * 0.8) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 4200);
  }
});
</script>
</body>
</html>
